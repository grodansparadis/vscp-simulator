name: Linux Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            qt6-base-dev qt6-declarative-dev \
            libmosquitto-dev libexpat1-dev libssl-dev libcurl4-openssl-dev pandoc

      - name: Test version updater
        run: python3 -B tests/test_update_version.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/vscpsim --version
          build/vscpsim --help

      - name: Install and package
        run: |
          DESTDIR="$GITHUB_WORKSPACE/staging" cmake --install build
          tar -C staging -czf vscpsim-linux-x86_64.tar.gz .

      - name: Write SHA256SUMS
        id: sha256sums
        run: |
          bash .github/scripts/write-sha256sums.sh SHA256SUMS-vscpsim-linux-x86_64 <<'SHA256SUMS_PATTERNS'
          vscpsim-linux-x86_64.tar.gz
          SHA256SUMS_PATTERNS

      - uses: actions/upload-artifact@v7
        with:
          name: vscpsim-linux-x86_64
          path: |
            vscpsim-linux-x86_64.tar.gz
            ${{ steps.sha256sums.outputs.file }}
          if-no-files-found: error
