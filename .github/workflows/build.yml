name: Build

# Raspberry Pi (32/64-bit), macOS and Windows builds of vscpsim. The Linux
# amd64 build is in cmake.yml (Linux Build) and appimage.yml (AppImage).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  raspberry-pi:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Raspberry Pi 32-bit (armhf)
            # GitHub's ARM runners cannot execute 32-bit ARM code, so emulate it.
            runner: ubuntu-latest
            platform: linux/arm/v7
            deb_arch: armhf
            qemu: true
          - name: Raspberry Pi 64-bit (arm64)
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            deb_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Enable cross-architecture emulation
        if: matrix.qemu
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm

      # Debian bookworm is the base of Raspberry Pi OS bookworm; the binary
      # uses the distribution's Qt 6 so it runs with the Pi's own packages.
      - name: Build and install
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker run --rm \
            --platform "$TARGET_PLATFORM" \
            --network host \
            --env DEB_ARCH \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            debian:bookworm \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                cmake \
                git \
                qt6-base-dev \
                qt6-declarative-dev \
                libmosquitto-dev \
                libexpat1-dev \
                libssl-dev \
                libcurl4-openssl-dev
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build --parallel "$(nproc)"
              DESTDIR=/src/staging cmake --install build
              tar -C /src/staging -czf "/src/vscpsim-linux-$DEB_ARCH.tar.gz" .
            '

      - name: Write SHA256SUMS
        id: sha256sums
        continue-on-error: true
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-vscpsim-linux-${{ matrix.deb_arch }}" <<'SHA256SUMS_PATTERNS'
          vscpsim-linux-${{ matrix.deb_arch }}.tar.gz
          SHA256SUMS_PATTERNS

      - uses: actions/upload-artifact@v4
        with:
          name: vscpsim-linux-${{ matrix.deb_arch }}
          path: |
            vscpsim-linux-${{ matrix.deb_arch }}.tar.gz
            ${{ steps.sha256sums.outputs.file }}
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Qt 6.8 links the AGL framework, which newer Xcode SDKs no longer have
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install dependencies
        run: brew install expat mosquitto openssl@3 ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build
        run: cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Install
        run: |
          cmake --install build --config ${BUILD_TYPE} --prefix "${{ github.workspace }}/staging"
          ls "${{ github.workspace }}/staging"
          tar -C "${{ github.workspace }}/staging" -czf "${{ github.workspace }}/vscpsim-macos-arm64.tar.gz" .

      - name: Write SHA256SUMS
        id: sha256sums
        continue-on-error: true
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-vscpsim-macos-arm64" <<'SHA256SUMS_PATTERNS'
          vscpsim-macos-arm64.tar.gz
          SHA256SUMS_PATTERNS

      - uses: actions/upload-artifact@v4
        with:
          name: vscpsim-macos-arm64
          path: |
            vscpsim-macos-arm64.tar.gz
            ${{ steps.sha256sums.outputs.file }}
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone --depth=1 --branch 2026.06.01 https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/.vcpkg"
          & "${{ github.workspace }}/.vcpkg/bootstrap-vcpkg.bat"

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = "${{ github.workspace }}/.vcpkg/vcpkg.exe"
          & $vcpkg install curl:${env:TRIPLET} dlfcn-win32:${env:TRIPLET} expat:${env:TRIPLET} mosquitto:${env:TRIPLET} openssl:${env:TRIPLET} pthreads:${env:TRIPLET}

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DVCPKG_TARGET_TRIPLET=%TRIPLET% -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\.vcpkg\scripts\buildsystems\vcpkg.cmake -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Install
        shell: pwsh
        run: |
          cmake --install build --config ${{ env.BUILD_TYPE }} --prefix "${{ github.workspace }}/staging"
          Copy-Item "${{ github.workspace }}/.vcpkg/installed/${{ env.TRIPLET }}/bin/*.dll" "${{ github.workspace }}/staging/bin/"
          Get-ChildItem "${{ github.workspace }}/staging/bin" | Select-Object -ExpandProperty Name
          Compress-Archive -Path "${{ github.workspace }}/staging/*" -DestinationPath "${{ github.workspace }}/vscpsim-windows-x64.zip"

      - name: Write SHA256SUMS
        id: sha256sums
        continue-on-error: true
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-vscpsim-windows-x64" <<'SHA256SUMS_PATTERNS'
          vscpsim-windows-x64.zip
          SHA256SUMS_PATTERNS

      - uses: actions/upload-artifact@v4
        with:
          name: vscpsim-windows-x64
          path: |
            vscpsim-windows-x64.zip
            ${{ steps.sha256sums.outputs.file }}
          if-no-files-found: error
